<!-- MRB: Code to fix iOS Safari/Brave "stuck" mobile Profiles and Weather buttons -->
<script>
  document.addEventListener('click', function(event) {
    /* If the user clicks anywhere that isn't the Profiles button, force remove focus */
    if (!event.target.closest('.btn--wrapper .btn')) {
      document.activeElement.blur();
    }
  });
  document.addEventListener('click', function(event) {
    /* If the user clicks anywhere that isn't the Weather button, force remove focus */
    if (!event.target.closest('.weather__urls-wrapper .btn')) {
      document.activeElement.blur();
    }
  });
</script>
