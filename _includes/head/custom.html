<!-- MRB: GoatCounter analytics for the 8 regular content pages -->
<script data-goatcounter="https://brundinm.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

<!-- MRB: Track link clicks, but not clicks to the 8 regular content pages -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var links = document.getElementsByTagName('a');
    /* Add the URL paths of the 8 regular content pages to ignore */
    var contentPages = ['/', '/publications/', '/presentations/', '/teaching/', '/service/', '/code/', '/gallery/', '/art/'];

    for (var i = 0; i < links.length; i++) {
      links[i].addEventListener('click', function (e) {
        if (!window.goatcounter || !window.goatcounter.count) return;

        var href = this.getAttribute('href');
        /* Ignore empty links, page anchors (#), and mail links */
        if (!href || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('javascript:')) return;

        /* Resolve link to get just the local pathname (e.g., "/presentations/") */
        var targetUrl = new URL(this.href);
        var path = targetUrl.pathname;

        /* Ensure trailing slashes match the contentPages list format */
        if (path !== '/' && !path.endsWith('/')) path += '/';

        /* If the link points to one of the 8 regular pages, do not log an event */
        if (targetUrl.hostname === window.location.hostname && contentPages.includes(path)) return;

        /* Log everything else (external links and internal links) as a flat event */
        window.goatcounter.count({
          path:  href,
          title: this.innerText.trim() || href,
          event: true,
        });
      });
    }
  });
</script>

<!-- MRB: Track hover events for dinkus1, dinkus2, and digital-clock -->
<script>
document.addEventListener("DOMContentLoaded", function () {
  /* Ensure GoatCounter is fully loaded before binding events */
  if (!window.goatcounter || !window.goatcounter.count) return;

  /* Track hover on dinkus1 */
  const dinkus1 = document.querySelector('p.dinkus1');
  if (dinkus1) {
    dinkus1.addEventListener('mouseenter', function () {
      window.goatcounter.count({
        path:  'hover-dinkus1',
        title: 'Hovered dinkus1',
        event: true,
      });
    }, { once: true });
  }

  /* Track hover on dinkus2 */
  const dinkus2 = document.querySelector('p.dinkus2');
  if (dinkus2) {
    dinkus2.addEventListener('mouseenter', function () {
      window.goatcounter.count({
        path:  'hover-dinkus2',
        title: 'Hovered dinkus2',
        event: true,
      });
    }, { once: true });
  }

  /* Track hover on digital-clock */
  const digitalClock = document.querySelector('pre.digital-clock');
  if (digitalClock) {
    digitalClock.addEventListener('mouseenter', function () {
      window.goatcounter.count({
        path:  'hover-digital-clock',
        title: 'Hovered digital-clock',
        event: true,
      });
    }, { once: true });
  }
});
</script>
