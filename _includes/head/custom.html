<!-- MRB: Track external link clicks (Umami) -->
<script type="text/javascript">
  document.addEventListener('click', function (event) {
    const link = event.target.closest('a');
    if (link && link.href) {
      const url = new URL(link.href, window.location.href);
      if (url.host !== window.location.host && window.umami) {
        window.umami.track('outbound-link-click', { url: link.href });
      }
    }
  });
</script>

{% assign target_pages = "/,/publications/,/presentations/,/teaching/,/service/,/code/,/gallery/,/art/" | split: "," %}
{% if target_pages contains page.url %}
<!-- MRB: Track link clicks, but not clicks to the 8 content pages (GoatCounter) -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var links = document.getElementsByTagName('a');
    /* Add the URL paths of the 8 content pages to ignore */
    var contentPages = ['/', '/publications/', '/presentations/', '/teaching/', '/service/', '/code/', '/gallery/', '/art/'];
    for (var i = 0; i < links.length; i++) {
      links[i].addEventListener('click', function (e) {
        if (!window.goatcounter || !window.goatcounter.count) return;
        var href = this.getAttribute('href');
        /* Ignore empty links, page anchors (#), and mail links */
        if (!href || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('javascript:')) return;
        /* Resolve link to get just the local pathname (e.g., "/publications/") */
        var targetUrl = new URL(this.href);
        var path = targetUrl.pathname;
        /* Ensure trailing slashes match the contentPages list format */
        if (path !== '/' && !path.endsWith('/')) path += '/';
        /* If the link points to one of the 8 content pages, do not log an event */
        if (targetUrl.hostname === window.location.hostname && contentPages.includes(path)) return;
        /* Log everything else (external links and internal links) as a flat event */
        window.goatcounter.count({
          path:  href,
          title: this.innerText.trim() || href,
          event: true,
        });
      });
    }
  });
</script>
{% endif %}
